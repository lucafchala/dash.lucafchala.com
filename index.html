    function applyLang(l) {
        lang = l in STRINGS ? l : 'pt';
        const root = document.documentElement;
        root.lang = lang === 'pt' ? 'pt-BR' : 'en';
        root.dataset.lang = lang;
        document.querySelectorAll('[data-i18n]').forEach(e => { const v = s()[e.dataset.i18n]; if (typeof v === 'string') e.textContent = v; });
        document.querySelectorAll('[data-i18n-attr]').forEach(e => e.dataset.i18nAttr.split(';').forEach(p => { const [attr, key] = p.split(':'); if (typeof s()[key] === 'string') e.setAttribute(attr, s()[key]); }));
        document.querySelectorAll('[data-action="lang"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
        el('h1-title').innerHTML = s().h1;
        el('shortcuts').innerHTML = s().shortcuts;
        el('na-group').innerHTML = GROUPS.map(g => `<option value="${g}"${g === 'tools' ? ' selected' : ''}>${esc(groupLabel(g))}</option>`).join('');
        el('na-status').innerHTML = [302, 301].map(v => `<option value="${v}">${esc(s()['status_' + v])}</option>`).join('');
        el('pm-type').querySelectorAll('option').forEach(o => { o.textContent = s()['type_' + o.value]; });
        renderHubs(); renderRepos(); renderRedirects(); renderPastes(); updatePurlSaveBar(); updatePasteSaveBar(); updateBanner(); renderClicksNote();
    }
    function toggleTheme() {
        const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
        document.documentElement.dataset.theme = next;
        writePref('theme', next);
        const m = document.querySelector('meta[name="theme-color"]');
        if (m) m.content = next === 'light' ? '#f4efe6' : '#0d0c0a';
    }

    /* ── Events ── */
    function el(id) { return document.getElementById(id); }

    document.addEventListener('click', e => {
        const t = e.target.closest('[data-action]');
        if (!t) return;
        const slug = t.dataset.slug;
        switch (t.dataset.action) {
            case 'lang': writePref('lang', t.dataset.lang); applyLang(t.dataset.lang); break;
            case 'theme': toggleTheme(); break;
            case 'settings': showSettings(); break;
            case 'close-dialog': t.closest('dialog').close(); break;
            case 'clear-pat': LS.del('gh_pat'); el('input-pat').value = ''; t.hidden = true; updateGhBtn(); break;
            case 'reload': reloadAll(); break;
            case 'toggle-group': {
                const g = t.dataset.group;
                if (query()) break;
                if (collapsedGroups.has(g)) collapsedGroups.delete(g); else collapsedGroups.add(g);
                const open = !collapsedGroups.has(g);
                t.setAttribute('aria-expanded', String(open));
                el(t.getAttribute('aria-controls')).hidden = !open;
                break;
            }
            case 'copy': copyWithFeedback(`https://lucafchala.com/${slug}`, t); break;
            case 'qr': showQr(slug); break;
            case 'edit-purl': editingSlug = slug; renderRedirects(); break;
            case 'cancel-edit': editingSlug = null; renderRedirects(); break;
            case 'move': movePurl(slug, Number(t.dataset.dir)); break;
            case 'delete-purl': deletePurl(slug); break;
            case 'discard-purls': purl.items = clone(purl.saved); editingSlug = null; afterPurlChange(); break;
            case 'save-purls': savePurls(); break;
            case 'sync-purls': syncPurls(); break;
            case 'export': exportPurls(); break;
            case 'import': el('import-file').click(); break;
            case 'new-paste': showPasteDialog(null); break;
            case 'edit-paste': showPasteDialog(slug); break;
            case 'delete-paste': deletePaste(slug); break;
            case 'discard-pastes': paste.items = clone(paste.saved); afterPasteChange(); break;
            case 'save-pastes': savePastes(); break;
            case 'regen-pastes': regenPastes(); break;
            case 'toggle-preview': { const p = el('pm-preview'); p.hidden = !p.hidden; if (!p.hidden) renderPreview(); break; }
        }
    });

    document.addEventListener('submit', e => {
        const f = e.target;
        if (f.id === 'purl-add-form') { e.preventDefault(); addPurl(); }
        else if (f.dataset.form === 'edit-purl') { e.preventDefault(); savePurlEdit(f); }
        else if (f.id === 'settings-form') { if (!saveSettings()) e.preventDefault(); }
        else if (f.id === 'paste-form') { if (!confirmPasteEdit()) e.preventDefault(); }
    });

    el('search').addEventListener('input', () => { editingSlug = null; renderRedirects(); renderPastes(); });
    el('import-file').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) importPurls(f); });
    el('pm-type').addEventListener('change', () => { el('pm-fp-field').hidden = el('pm-type').value !== 'pgp'; if (!el('pm-preview').hidden) renderPreview(); });
    el('pm-content').addEventListener('input', () => { if (!el('pm-preview').hidden) renderPreview(); });

    document.addEventListener('keydown', e => {
        const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') {
            e.preventDefault();
            if (el('paste-dialog').open) { if (confirmPasteEdit()) el('paste-dialog').close(); return; }
            if (purlDirty()) savePurls(); else if (pasteDirty()) savePastes();
            return;
        }
        if (e.key === 'Escape' && !document.querySelector('dialog[open]')) {
            if (editingSlug !== null) { editingSlug = null; renderRedirects(); }
            else if (e.target === el('search') && el('search').value) { el('search').value = ''; renderRedirects(); renderPastes(); }
            return;
        }
        if (typing || e.metaKey || e.ctrlKey || e.altKey || document.querySelector('dialog[open]')) return;
        if (e.key === '/') { e.preventDefault(); el('search').focus(); }
        else if (e.key === 'n' && !el('purl-add-form').hidden) { e.preventDefault(); el('na-slug').focus(); }
    });

    window.addEventListener('beforeunload', e => {
        if (purlDirty() || pasteDirty() || purl.saving || paste.saving) { e.preventDefault(); e.returnValue = ''; }
    });

    /* ── Bootstrap ── */
    async function probeProxy() {
        try {
            const r = await fetch('/api/github', { cache: 'no-store', credentials: 'same-origin' });
            if (r.status === 401) { sessionExpired(); return false; }
            if (!r.ok) return false;
            return !!(await r.json()).configured;
        } catch { return false; }
    }
    async function reloadAll() {
        serverGh = await probeProxy();
        updateGhBtn();
        await Promise.all([loadPurls(), loadPastes()]);
    }
    function loadStatus() {
        fetch('https://status.lucafchala.com/api/status', { cache: 'no-store' })
            .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
            .then(data => {
                statusMap = {};
                (data.services || []).forEach(m => { if (m.url && m.status) statusMap[normalizeUrl(m.url)] = m.status; });
                renderHubs();
            })
            .catch(() => { /* dots stay neutral */ });
    }

    applyLang(lang);
    reloadAll();
    loadStatus();

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
    }
    </script>
</body>
